<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Recipes</title>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #FFFFFF;
      --ink:      #1A1A1A;
      --muted:    #666666;
      --rule:     #E5E5E5;
      --accent:   #C0392B;   /* a warm red — feels cookbook-ish */
      --tag-bg:   #F2F2F2;
      --tag-active-bg: #C0392B;
      --tag-active-fg: #FFFFFF;
      --font:     'Georgia', serif;
      --font-ui:  system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 1rem;
      line-height: 1.7;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Layout ── */
    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    /* ── Header ── */
    header {
      border-bottom: 2px solid var(--ink);
      padding: 2.5rem 0 1.5rem;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: normal;
      letter-spacing: -0.01em;
      margin-bottom: 0.25rem;
    }

    header p {
      font-family: var(--font-ui);
      font-size: 0.9rem;
      color: var(--muted);
    }

    /* ── Tag filter bar ── */
    .tag-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .tag-btn {
      font-family: var(--font-ui);
      font-size: 0.78rem;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      border: 1px solid #CCCCCC;
      background: var(--tag-bg);
      color: var(--ink);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      letter-spacing: 0.03em;
    }

    .tag-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .tag-btn.active {
      background: var(--tag-active-bg);
      color: var(--tag-active-fg);
      border-color: var(--tag-active-bg);
    }

    /* ── Recipe count ── */
    .recipe-count {
      font-family: var(--font-ui);
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    /* ── Recipe grid ── */
    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.25rem;
      margin-bottom: 3rem;
    }

    /* ── Recipe card ── */
    .recipe-card {
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 1.1rem 1.1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: border-color 0.15s, box-shadow 0.15s;
      cursor: pointer;
    }

    .recipe-card:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }

    .recipe-card h2 {
      font-size: 1.05rem;
      font-weight: normal;
      line-height: 1.3;
    }

    .recipe-card .meta {
      font-family: var(--font-ui);
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      gap: 1rem;
    }

    .recipe-card .intro {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .recipe-card .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-top: 0.25rem;
    }

    .card-tag {
      font-family: var(--font-ui);
      font-size: 0.7rem;
      background: var(--tag-bg);
      border-radius: 999px;
      padding: 0.15rem 0.55rem;
      color: var(--muted);
    }

    /* ── No results ── */
    .no-results {
      font-family: var(--font-ui);
      color: var(--muted);
      padding: 2rem 0;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--rule);
      padding: 1.5rem 0;
      font-family: var(--font-ui);
      font-size: 0.78rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

<div class="wrap">

  <header>
    <h1>Our Recipes (tomato and gluten free)</h1>
    <p>A personal collection — click a tag to filter.</p>
  </header>

  <!-- Tag filter buttons built by JS -->
  <div class="tag-bar" id="tagBar"></div>

  <p class="recipe-count" id="recipeCount"></p>

  <!-- Recipe cards built by JS -->
  <div class="recipe-grid" id="recipeGrid"></div>

  <footer>
    <p>Made with plain HTML &amp; JavaScript &mdash; hosted on GitHub Pages.</p>
  </footer>

</div>

<script src="recipes.js"></script>
<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let activeTag = null;

  // ── Gather all unique tags from recipes ───────────────────────────────────
  function allTags() {
    const set = new Set();
    RECIPES.forEach(r => r.tags.forEach(t => set.add(t)));
    return Array.from(set).sort();
  }

  // ── Format a tag for display (hyphens → spaces, capitalised) ──────────────
  function formatTag(tag) {
    return tag.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  // ── Build tag bar ──────────────────────────────────────────────────────────
  function buildTagBar() {
    const bar = document.getElementById('tagBar');
    bar.innerHTML = '';

    // "All" button
    const allBtn = document.createElement('button');
    allBtn.className = 'tag-btn' + (activeTag === null ? ' active' : '');
    allBtn.textContent = 'All';
    allBtn.addEventListener('click', () => { activeTag = null; render(); });
    bar.appendChild(allBtn);

    allTags().forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'tag-btn' + (activeTag === tag ? ' active' : '');
      btn.textContent = formatTag(tag);
      btn.addEventListener('click', () => {
        activeTag = (activeTag === tag) ? null : tag;
        render();
      });
      bar.appendChild(btn);
    });
  }

  // ── Build recipe grid ──────────────────────────────────────────────────────
  function buildGrid() {
    const grid  = document.getElementById('recipeGrid');
    const count = document.getElementById('recipeCount');
    grid.innerHTML = '';

    const filtered = activeTag
      ? RECIPES.filter(r => r.tags.includes(activeTag))
      : RECIPES;

    count.textContent = filtered.length === 1
      ? '1 recipe'
      : `${filtered.length} recipes`;

    if (filtered.length === 0) {
      grid.innerHTML = '<p class="no-results">No recipes found for that tag.</p>';
      return;
    }

    filtered.forEach(recipe => {
      const card = document.createElement('div');
      card.className = 'recipe-card';
      card.addEventListener('click', () => {
        window.location.href = `recipe.html?id=${recipe.id}`;
      });

      const tagsHtml = recipe.tags
        .map(t => `<span class="card-tag">${formatTag(t)}</span>`)
        .join('');

      card.innerHTML = `
        <h2>${recipe.title}</h2>
        <div class="meta">
          <span>⏱ ${recipe.time}</span>
          <span>🍽 Serves ${recipe.serves}</span>
        </div>
        ${recipe.intro ? `<p class="intro">${recipe.intro}</p>` : ''}
        <div class="card-tags">${tagsHtml}</div>
      `;

      grid.appendChild(card);
    });
  }

  // ── Render both ────────────────────────────────────────────────────────────
  function render() {
    buildTagBar();
    buildGrid();
  }

  render();
</script>
</body>
</html>
